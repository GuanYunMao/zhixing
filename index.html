<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 40px;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#0f172a}

<p class="sub">给手机/电脑的脚本管理器安装</p>

<div class="card">

  <ol class="steps">
    <li>手机 Edge → 扩展 → 搜索 <b>Tampermonkey</b> 或 <b>脚本猫</b></li>
    <li>装好后回到本页，点「安装 →」</li>
  </ol>

<div class="card">

  <div class="item"><span class="name">知行 · 通用版</span><span class="meta">v4.0.0 · 646.7 KB</span><span class="desc">完整版，含字体解密表</span><span class="links"><a class="go" href="./zhixing.user.js">安装 →</a><a class="go alt" href="./zhixing.user.js" download>下载文件</a></span></div>
<div class="item"><span class="name">知行 · 通用版（轻量）</span><span class="meta">v4.0.0-lite · 436.7 KB</span><span class="desc">去掉字体表，小 210KB</span><span class="links"><a class="go" href="./zhixing-lite.user.js">安装 →</a><a class="go alt" href="./zhixing-lite.user.js" download>下载文件</a></span></div>
